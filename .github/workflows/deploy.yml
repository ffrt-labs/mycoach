name: Deploy to home server

on:
  push:
    branches: ['main']

jobs:
  deploy:
    name: Deployment
    runs-on: self-hosted
    steps:
      - name: Setup PATH
        run: echo "/usr/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run logger JS tests
        run: node --test src/mycoach/static/logger/app.test.js

      - name: Write .env from secrets and vars
        run: |
          cat > .env <<'EOF'
          MYCOACH_ENV=production
          MYCOACH_DEBUG=false
          MYCOACH_LOG_LEVEL=INFO
          MYCOACH_TIMEZONE=${{ vars.MYCOACH_TIMEZONE }}
          MYCOACH_ENCRYPTION_KEY=${{ secrets.MYCOACH_ENCRYPTION_KEY }}

          # mycoach-db (Postgres, docker-compose.yml) — engine-swap target
          # for map #85, ticket #107. Read by docker compose for variable
          # substitution, not by the app itself. MYCOACH_RUNTIME_DB_URL is the
          # cutover switch: blank keeps the app on SQLite, a
          # postgresql+asyncpg://mycoach:<password>@mycoach-db/mycoach secret
          # moves it to Postgres (docs/postgres-cutover.md).
          MYCOACH_DATABASE_PASSWORD=${{ secrets.MYCOACH_DATABASE_PASSWORD }}
          MYCOACH_RUNTIME_DB_URL=${{ secrets.MYCOACH_RUNTIME_DB_URL }}

          # Health/coaching seam logins (#184/#186, docs/migrations/186-cutover.md):
          # after the cutover MYCOACH_RUNTIME_DB_URL is the coaching_runtime login,
          # this is health_runtime, and the owner URLs run each history's
          # migrations at startup. Each left unset falls back to
          # MYCOACH_RUNTIME_DB_URL.
          MYCOACH_HEALTH_RUNTIME_DB_URL=${{ secrets.MYCOACH_HEALTH_RUNTIME_DB_URL }}
          MYCOACH_COACHING_OWNER_DB_URL=${{ secrets.MYCOACH_COACHING_OWNER_DB_URL }}
          MYCOACH_HEALTH_OWNER_DB_URL=${{ secrets.MYCOACH_HEALTH_OWNER_DB_URL }}

          # This box's tailnet address (ticket #117) — a variable, not a
          # secret, same as homelab-apps' NEKO_NAT1TO1_IP: it's the address
          # every tailnet client already routes to, not something to keep
          # hidden. Grafana reaches mycoach-db's health_analytics schema
          # through it.
          MYCOACH_DB_TAILNET_IP=${{ vars.MYCOACH_DB_TAILNET_IP }}

          # Split-out /logger origin (issue #60). Both blank keeps the legacy
          # same-origin mount; set together once the mycoach-logger container
          # and its homelab-edge route are actually live.
          MYCOACH_LOGGER_ORIGIN=${{ vars.MYCOACH_LOGGER_ORIGIN }}
          MYCOACH_API_ORIGIN=${{ vars.MYCOACH_API_ORIGIN }}

          MYCOACH_GARMIN_EMAIL=${{ secrets.MYCOACH_GARMIN_EMAIL }}
          MYCOACH_GARMIN_PASSWORD=${{ secrets.MYCOACH_GARMIN_PASSWORD }}
          MYCOACH_HEVY_EMAIL=${{ secrets.MYCOACH_HEVY_EMAIL }}
          MYCOACH_HEVY_PASSWORD=${{ secrets.MYCOACH_HEVY_PASSWORD }}

          MYCOACH_LLM_PROVIDER=${{ vars.MYCOACH_LLM_PROVIDER }}
          MYCOACH_CLAUDE_API_KEY=${{ secrets.MYCOACH_CLAUDE_API_KEY }}
          MYCOACH_CLAUDE_MODEL_DAILY=${{ vars.MYCOACH_CLAUDE_MODEL_DAILY }}
          MYCOACH_CLAUDE_MODEL_WEEKLY=${{ vars.MYCOACH_CLAUDE_MODEL_WEEKLY }}
          MYCOACH_CLAUDE_MONTHLY_COST_CEILING=${{ vars.MYCOACH_CLAUDE_MONTHLY_COST_CEILING }}

          # claude_code provider (issue #164): the Claude Pro subscription token
          # from `claude setup-token`, under the CLI's own (unprefixed) name.
          CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MYCOACH_CLAUDE_CODE_MODEL_DAILY=${{ vars.MYCOACH_CLAUDE_CODE_MODEL_DAILY }}
          MYCOACH_CLAUDE_CODE_MODEL_WEEKLY=${{ vars.MYCOACH_CLAUDE_CODE_MODEL_WEEKLY }}

          # Langfuse tracing (issue #172): on only when all three are set. The
          # base URL is a *variable* (http://langfuse-web:3000), the keys are
          # secrets; saving the URL as a secret would leave tracing off.
          LANGFUSE_BASE_URL=${{ vars.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PROMPT_CACHE_TTL=${{ vars.LANGFUSE_PROMPT_CACHE_TTL }}

          MYCOACH_EMAIL_ENABLED=${{ vars.MYCOACH_EMAIL_ENABLED }}
          MYCOACH_EMAIL_FROM=${{ secrets.MYCOACH_EMAIL_FROM }}
          MYCOACH_EMAIL_TO=${{ secrets.MYCOACH_EMAIL_TO }}
          MYCOACH_EMAIL_SMTP_HOST=${{ vars.MYCOACH_EMAIL_SMTP_HOST }}
          MYCOACH_EMAIL_SMTP_PORT=${{ vars.MYCOACH_EMAIL_SMTP_PORT }}
          MYCOACH_EMAIL_SMTP_USER=${{ secrets.MYCOACH_EMAIL_SMTP_USER }}
          MYCOACH_EMAIL_SMTP_PASSWORD=${{ secrets.MYCOACH_EMAIL_SMTP_PASSWORD }}
          MYCOACH_EMAIL_RESEND_API_KEY=${{ secrets.MYCOACH_EMAIL_RESEND_API_KEY }}
          EOF
          # Drop keys whose secret/var was left undefined — an empty value would
          # override the app's default and break typed fields (int/float/bool)
          # and the timezone, crashing Settings() at startup.
          sed -i '/^[A-Za-z_][A-Za-z0-9_]*=$/d' .env

      - name: Build image
        run: docker compose build

      - name: Start services
        run: docker compose up -d --force-recreate --remove-orphans

      # `up -d` returns as soon as the containers start, so a startup crash (a failed
      # migration, a bad setting) used to deploy green and crash-loop unnoticed. Fail the
      # deploy unless the app reaches its Dockerfile HEALTHCHECK's `healthy`. Runs before
      # the prune, so the previous image is still there to roll back to.
      - name: Wait for mycoach to be healthy
        run: |
          for _ in $(seq 1 36); do
            state=$(docker inspect mycoach --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}')
            case "$state" in
              "running healthy") echo "mycoach is healthy."; exit 0 ;;
              restarting*|exited*|dead*|"running unhealthy") break ;;
            esac
            sleep 5
          done
          echo "::error::mycoach did not become healthy (state: $state)"
          docker logs --tail 80 mycoach
          exit 1

      - name: Prune old images
        run: docker image prune -f
