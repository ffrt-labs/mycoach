services:
  # Engine-swap target for the observed-athlete-record extraction (map #85,
  # ticket #107). `mycoach` switches to it via MYCOACH_RUNTIME_DB_URL once the
  # data is copied (docs/postgres-cutover.md).
  # Stays off the `edge` network — like homelab-apps' datastores, a database
  # reachable from every edge-joined container is exactly the exposure this
  # setup avoids. Unpublished to every Docker network but the tailnet bind
  # below (ticket #117): only containers on the default compose network, plus
  # tailnet clients on port 5432 specifically, can reach it — which is why
  # `mycoach` joins both `default` and `mycoach-internal` rather than relying
  # on the published port for its own access.
  mycoach-db:
    image: postgres:16-alpine
    container_name: mycoach-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mycoach
      - POSTGRES_PASSWORD=${MYCOACH_DATABASE_PASSWORD}
      - POSTGRES_DB=mycoach
    volumes:
      - mycoach-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycoach"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Grafana (homelab-observability) is a different compose project, on its
    # own Docker networks, so it has no route to this project's `default` or
    # `mycoach-internal` networks and can only reach mycoach-db over the
    # network both boxes share: the tailnet (map #85, ticket #117). Bound to
    # the host's tailnet address specifically, not 0.0.0.0 — a LAN- or
    # publicly-reachable bind would expose Postgres to every device the
    # tailnet boundary is supposed to keep out (homelab-edge ADR 0001).
    # `tailscale ip -4` on the host, never hardcoded (homelab-host/RUNBOOK.md
    # step 7: "never written down anywhere, only queried live"); `:?` fails
    # the deploy instead of silently publishing on every interface.
    ports:
      - "${MYCOACH_DB_TAILNET_IP:?set MYCOACH_DB_TAILNET_IP}:5432:5432"

  # Scheduled pg_dump for mycoach-db (ticket #161) — mycoach-db has held real
  # history since #107 with no backup mechanism at all. A separate long-lived
  # container rather than a job inside `mycoach`'s own APScheduler: pg_dump's
  # wire protocol is version-sensitive, so the client needs to match the
  # server's major version exactly, and the simplest way to guarantee that is
  # to pin the same Postgres major version tag (16) here as mycoach-db rather
  # than track it in a second place (the app's Dockerfile). Debian-based, not
  # `-alpine` like mycoach-db: the backup script's scheduling loop relies on
  # GNU date's `-d "today HH:MM"` parsing, which busybox date doesn't support.
  # Only on `default` (implicit, no `networks:` override) — it needs nothing
  # from `edge` or `mycoach-internal`, so it isn't joined to either.
  mycoach-db-backup:
    image: postgres:16
    container_name: mycoach-db-backup
    restart: unless-stopped
    depends_on:
      mycoach-db:
        condition: service_healthy
    environment:
      - PGHOST=mycoach-db
      - PGUSER=mycoach
      - PGPASSWORD=${MYCOACH_DATABASE_PASSWORD}
      - PGDATABASE=mycoach
      - RETENTION_DAYS=${MYCOACH_BACKUP_RETENTION_DAYS:-14}
      - BACKUP_TIME=${MYCOACH_BACKUP_TIME:-03:00}
    volumes:
      - mycoach-db-backups:/backups
      - ./scripts/backup-mycoach-db.sh:/backup.sh:ro
    entrypoint: ["bash", "/backup.sh"]

  mycoach:
    build: .
    container_name: mycoach
    restart: unless-stopped
    env_file: .env
    depends_on:
      mycoach-db:
        condition: service_healthy
    environment:
      # Stays SQLite until the cutover runbook sets MYCOACH_RUNTIME_DB_URL on
      # the host; a later commit then flips this default.
      MYCOACH_DB_URL: ${MYCOACH_RUNTIME_DB_URL:-sqlite+aiosqlite:////data/mycoach.db}
      MYCOACH_GARMIN_TOKEN_DIR: /data/garmin_tokens
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    # Deliberately NOT on `edge`: only homelab-edge's Caddy shares
    # `mycoach-internal`, so a sibling container on `edge` cannot reach
    # mycoach:8000 directly and bypass Caddy. (homelab-edge#28)
    networks:
      - default
      - mycoach-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/system/status', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mycoach-logger:
    build:
      context: .
      dockerfile: Dockerfile.logger
    container_name: mycoach-logger
    restart: unless-stopped
    environment:
      # Absolute origin the logger PWA calls back to, e.g.
      # https://mycoach.yourdomain.com. Leave unset only for local testing —
      # a production deploy needs this so the logger's requests leave its own
      # origin correctly, and needs MYCOACH_LOGGER_ORIGIN (on the mycoach
      # service, above) set to this container's own public origin so CORS
      # lets those requests back in.
      MYCOACH_API_ORIGIN: ${MYCOACH_API_ORIGIN:-}
    networks:
      - edge

networks:
  edge:
    external: true
  # Created by homelab-edge's deploy; must already exist.
  mycoach-internal:
    external: true

volumes:
  app-data:
  mycoach-db-data:
  mycoach-db-backups:
